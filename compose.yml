# Finance Dashboard — Node/Express + Prisma/SQLite + Vite build.
# Join the same Docker network as your reverse proxy (set DOCKER_NETWORK in .env).
# Do not publish :3000 on 0.0.0.0 — the proxy reaches the container by name.
services:
  finance-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-dashboard:local
    container_name: finance-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # DATABASE_URL and JWT_SECRET come from .env — do not put secrets here
    volumes:
      - ./data:/data
    # No host ports. Optional debug only:
    # ports:
    #   - "127.0.0.1:3000:3000"
    networks:
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    # If SQLite EACCES on bind mount, match host UID (often 1000):
    # user: "1000:1000"
networks:
  proxy:
    external: true
    name: ${DOCKER_NETWORK:-proxy}
