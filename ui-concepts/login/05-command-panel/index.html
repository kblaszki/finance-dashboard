<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fast access for returning users — Finance Dashboard concept</title>
    <link rel="stylesheet" href="../../_shared/tokens.css">
    <link rel="stylesheet" href="../../_shared/primitives.css">
    <link rel="stylesheet" href="demo.css">
  </head>
  <body><main class="command-login"><section class="command-shell"><header><a class="brand" href="../../README.md"><span class="brand-mark">FD</span> Finance Dashboard</a><a class="back-link" href="../index.html">Concepts</a></header><div class="command-body"><div class="command-context"><p class="eyebrow">Command 01 / Authenticate</p><h1>Open workspace</h1><dl><div><dt>Destination</dt><dd>/dashboard</dd></div><div><dt>Default currency</dt><dd>Last selection</dd></div><div><dt>Access</dt><dd>Private</dd></div></dl></div><div class="command-form"><div class="auth-card"><p class="eyebrow">Welcome back</p><h2>Sign in</h2><p class="muted">Continue to your private financial workspace.</p><form class="auth-form">
      <div class="field"><label for="email">Email</label><input class="field-control" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="password">Password</label><input class="field-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
      <button class="btn btn-primary btn--block" type="submit" disabled><span class="spinner" aria-hidden="true"></span> Signing in…</button>
    </form><p class="auth-switch muted">New here? <a href="../../register/index.html">Create an account</a></p></div></div></div></section></main></body>
</html>
