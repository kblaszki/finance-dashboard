<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A direct route back — Finance Dashboard concept</title>
    <link rel="stylesheet" href="../../_shared/tokens.css">
    <link rel="stylesheet" href="../../_shared/primitives.css">
    <link rel="stylesheet" href="demo.css">
  </head>
  <body><main class="focus-page"><a class="back-link" href="../index.html">Login concepts</a><section class="card auth-wrap"><div class="auth-card"><p class="eyebrow">Welcome back</p><h1>Sign in</h1><p class="muted">Continue to your private financial workspace.</p><form class="auth-form">
      <div class="field"><label for="email">Email</label><input class="field-control" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="password">Password</label><input class="field-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
      <button class="btn btn-primary btn--block" type="submit">Sign in</button>
    </form><p class="auth-switch muted">New here? <a href="../../register/index.html">Create an account</a></p></div></section><p class="trust-note">Private workspace · Session secured with authentication</p></main></body>
</html>
