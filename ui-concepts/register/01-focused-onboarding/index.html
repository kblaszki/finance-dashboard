<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A clean beginning — Finance Dashboard concept</title>
    <link rel="stylesheet" href="../../_shared/tokens.css">
    <link rel="stylesheet" href="../../_shared/primitives.css">
    <link rel="stylesheet" href="demo.css">
  </head>
  <body><main class="focus-page register-focus"><a class="back-link" href="../index.html">Register concepts</a><section class="card auth-wrap"><div class="auth-card"><p class="eyebrow">Start fresh</p><h1>Create your account</h1><p class="muted">Your new workspace will be empty—no sample accounts, balances or transactions.</p><form class="auth-form">
      <div class="field"><label for="email">Email</label><input class="field-control" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="username">Username</label><input class="field-control" id="username" name="username" autocomplete="username" placeholder="Your name"></div>
      <div class="field"><label for="password">Password</label><input class="field-control" id="password" name="password" type="password" autocomplete="new-password" placeholder="Choose a password"><p class="field-hint">Use at least 12 characters.</p></div>
      <button class="btn btn-primary btn--block" type="submit">Create empty workspace</button>
    </form><p class="auth-switch muted">Already registered? <a href="../../login/index.html">Sign in</a></p></div></section><div class="empty-promise"><span class="badge">Empty by design</span><p>Add your first account after registration. Nothing is pre-populated.</p></div></main></body>
</html>
